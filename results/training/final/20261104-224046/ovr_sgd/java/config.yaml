method: ovr_sgd
model_type: classical_ml
language: java
stage: final
seed: 42
features:
  type: tfidf_word_char
  word_ngram_range:
  - 1
  - 2
  char_ngram_range:
  - 3
  - 5
  max_features_per_vectorizer: 20000
model:
  wrapper: OneVsRestClassifier
  wrapper_params:
    n_jobs: null
    verbose: 0
  base_estimator: SGDClassifier
  base_params:
    alpha: 0.0001
    average: false
    class_weight: balanced
    early_stopping: false
    epsilon: 0.1
    eta0: 0.01
    fit_intercept: true
    l1_ratio: 0.15
    learning_rate: optimal
    loss: log_loss
    max_iter: 2000
    n_iter_no_change: 5
    n_jobs: null
    penalty: l2
    power_t: 0.5
    random_state: 42
    shuffle: true
    tol: 0.001
    validation_fraction: 0.1
    verbose: 0
    warm_start: false
output_dir: results/training/final/20261104-224046/ovr_sgd/java
