experiment: exp1_roberta_baseline
dataset_config: configs/datasets/nlbse2023_code_comments.yaml
output_dir: results/exp1_roberta_baseline
model:
  name: roberta-base
  hidden_size: 768
  num_labels: 19
  loss: BCEWithLogitsLoss
  threshold: 0.5
tokenizer:
  max_length: 128
training:
  seed: 42
  validation_fraction: 0.1
  epochs: 5
  batch_size: 16
  eval_batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  mixed_precision: false
  early_stopping_patience: 2
  num_workers: 0
evaluation:
  run_test_after_training: true
  report_per_label: true
